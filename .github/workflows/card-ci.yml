name: Card lint and test

on:
  push:
    paths:
      - "card/**"
      - ".github/workflows/card-ci.yml"
  pull_request:
    paths:
      - "card/**"
      - ".github/workflows/card-ci.yml"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate Playwright screenshot baselines (uploads them as an artifact instead of asserting against the committed ones)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: card/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: card/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Browser binary cached above; OS deps (apt packages) aren't part of
      # that cache and the runner VM is not reused between jobs, so install
      # whichever piece is actually missing.
      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests
        if: ${{ github.event.inputs.update_snapshots != 'true' }}
        run: npx playwright test

      - name: Regenerate screenshot baselines
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        run: npx playwright test --update-snapshots

      - name: Upload regenerated baselines
        if: ${{ github.event.inputs.update_snapshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: card/e2e/*.spec.js-snapshots/*-linux.png
