get_price_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: marketsentry
    outcome:
      required: true
      selector:
        text:
    interval:
      required: false
      default: "1d"
      selector:
        select:
          options:
            - "1h"
            - "6h"
            - "1d"
            - "1w"
            - "1m"
            - "all"
            - "max"
    fidelity:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes

refresh:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: marketsentry

search_markets:
  fields:
    query:
      required: true
      selector:
        text:
    limit:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
