name: Lint and test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Ruff
        run: ruff check custom_components/marketsentry

      - name: Mypy
        run: mypy custom_components/marketsentry

      - name: Pytest with coverage
        run: |
          pip install pytest-cov
          pytest tests \
            --cov=custom_components.marketsentry.detector \
            --cov=custom_components.marketsentry.api \
            --cov=custom_components.marketsentry.ws \
            --cov=custom_components.marketsentry.market_calendar \
            --cov=custom_components.marketsentry.providers \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -q
          # 90% was the original (Polymarket-only) target; the three
          # provider WS/streaming reconnect loops added later (finnhub.py,
          # alpaca.py, polymarket.py, ws.py) are inherently hard to cover
          # meaningfully without flaky timing-dependent tests. Measured
          # coverage as of 2026-10-31 is ~81%; 75% leaves margin without
          # chasing the reconnect-loop internals for diminishing returns.
          # detector.py/market_calendar.py/providers/base.py/providers/__init__.py
          # individually sit at 97-100%.
