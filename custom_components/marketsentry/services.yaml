get_price_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: marketsentry
    hours:
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 8760
          unit_of_measurement: hours

refresh:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: marketsentry

search_instruments:
  fields:
    provider:
      required: true
      selector:
        select:
          options:
            - "polymarket"
            - "finnhub"
            - "alpaca"
            - "fx"
    query:
      required: true
      selector:
        text:
    limit:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
